# ─────────────────────────────────────────────────────────────
# IntelliCrash — Eclipse Mosquitto MQTT Broker Configuration
# ─────────────────────────────────────────────────────────────

# Standard MQTT TCP listener
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener (for direct browser/dashboard telemetry streaming)
listener 9001 0.0.0.0
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
